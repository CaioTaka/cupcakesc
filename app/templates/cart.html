{% extends "base.html" %}
{% block title %}Carrinho | Cupcakes C{% endblock %}
{% block content %}
<section class="cart-page">
  <div class="cart-heading">
    <div><p class="eyebrow">Seu pedido</p><h1>Meu carrinho</h1></div>
    <a class="text-link" href="{{ url_for('main.catalog') }}">Continuar comprando</a>
  </div>

  <div id="cart-content">{% include "cart_content.html" %}</div>
  <p class="sr-only" id="cart-feedback" role="status" aria-live="polite"></p>
</section>
<script>
  const cartContent = document.getElementById('cart-content');
  const cartFeedback = document.getElementById('cart-feedback');
  cartContent.addEventListener('submit', async (event) => {
    const form = event.target.closest('form[data-cart-update]');
    if (!form) return;
    event.preventDefault();

    const action = form.dataset.action;
    const itemIndex = form.dataset.itemIndex;
    const button = event.submitter;
    if (button) button.disabled = true;

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' }
      });
      if (!response.ok) throw new Error('Não foi possível atualizar o carrinho.');
      const result = await response.json();
      cartContent.innerHTML = result.html;
      cartFeedback.textContent = result.message;

      const cartLabel = document.querySelector('[data-cart-nav-label]');
      if (cartLabel) cartLabel.textContent = result.cart_count ? `Carrinho · ${result.cart_count}` : 'Carrinho';

      if (action !== 'remove') {
        const nextButton = cartContent.querySelector(`[data-item-index="${itemIndex}"][data-action="${action}"] button`);
        if (nextButton) nextButton.focus({ preventScroll: true });
      }
    } catch (_) {
      window.location.reload();
    }
  });
</script>
{% endblock %}
